# Mochi schema for real typing in Weasel (M2-4).
# 与 PoC schema（experiments/003/rime-data）的差别：补了真实打字所需的
# 标点、recognizer、Shift 中英切换；候选仍 100% 出自 mochi_translator
# （brain 不可用时 punct 之外无候选，原始字母上屏——兜底策略见部署 README）。
schema:
  schema_id: mochi
  name: Mochi
  version: "0.3"
  description: |
    Mochi（默契）—— 懂你的个人记忆输入法。中英混打，候选来自 mochi brain。

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - mochi_translator

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: commit_code   # Shift 切英文时把已敲字母原样上屏
    Shift_R: commit_code

punctuator:
  full_shape:
    " ": { commit: "　" }
  half_shape:
    ",": "，"
    ".": "。"
    "?": "？"
    "!": "！"
    ":": "："
    ";": "；"
    "\\": "、"
    "\"": { pair: [ "“", "”" ] }
    "'": { pair: [ "‘", "’" ] }
    "(": "（"
    ")": "）"
    "<": "《"
    ">": "》"

recognizer:
  patterns: {}

# paging: -/= flip pages when the menu is open (PgUp/PgDn work natively);
# comma/period stay punctuation — binding them to paging breaks 。， commits
key_binder:
  bindings:
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }

menu:
  page_size: 9
