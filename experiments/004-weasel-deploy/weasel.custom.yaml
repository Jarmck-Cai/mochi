# Mochi：给 aqua 配色方案补 comment 色——ghost 灰字暂借 comment_text_color
# 渲染（aqua 原本未定义该项，回退成正文同色导致灰字不可见）。
#
# 高亮态注意：aqua 高亮候选是蓝底白字（hilited_candidate_text_color
# 0xffffff），ghost 用 0xeeeeee 与白字肉眼不可分——而补全候选几乎总是
# 首选=高亮候选，等于用户看到的地方永远没有灰。改用半透明白
# 0x80ffffff（AABBGGRR，alpha 0x80），蓝底上渲染为褪色浅蓝白。
# 下次 weasel 重编将引入独立的 ghost_text_color 样式项。
patch:
  "preset_color_schemes/aqua/comment_text_color": 0x999999
  "preset_color_schemes/aqua/hilited_comment_text_color": 0x80ffffff
